name: Test Coverage and Deploy to Pages

on:
  push:
    branches: 
      - "master"
      - "main"
      - "feature-tests-and-pages"
      - "feature/*"
  pull_request:
    branches: 
      - "master"
      - "main"
      - "feature-tests-and-pages"
      - "feature/*"

permissions:
  contents: read   # Достаточно для чтения кода
  pages: write      # Нужно для деплоя на Pages
  id-token: write   # Нужно для авторизации деплоя

# Разрешаем запускать только один деплой одновременно, чтобы они не конфликтовали
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-html

    - name: Run tests & Generate Both Reports
      run: |
        # Генерируем отчеты в папку htmlcov
        pytest --cov=. --cov-report=html:htmlcov --html=htmlcov/tests.html --self-contained-html || true

    - name: Inject Navigation Menu into HTML Reports
      run: |
        NAV_HTML="<div style='background:#333;padding:10px;text-align:center;font-family:sans-serif;'><a href='index.html' style='color:#fff;margin-right:20px;text-decoration:none;font-weight:bold;'>📊 Покрытие кода (Coverage)</a><a href='tests.html' style='color:#fff;text-decoration:none;font-weight:bold;'>🧪 Результаты тестов (Pytest)</a></div>"
        sed -i "s|<body>|<body>${NAV_HTML}|g" htmlcov/index.html
        sed -i "s|<body>|<body>${NAV_HTML}|g" htmlcov/tests.html

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Artifact for Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: './htmlcov' # Папка, которую нужно опубликовать

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4